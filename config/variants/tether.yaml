# config/variants/tether.yaml
name: starling2max_tether

tether:
  count: 3 # number of tether attachments 
  rest_length: 3.0 # [m]
  stiffness: 1500.0 # [N/m]
  damping: 200.0 # [N s/m]
  torsional_damping: 2.0e-4 # [N m s/rad]
  gate_tension: 0.3 # [N]
  drone_attach: {
    radius: 0.0289,
    z: -0.02,
    phase_deg: 0  
  }

payload:
  shape: box
  mass: 0.4 # [kg]
  size: [0.2, 0.2, 0.05] # [m]
  attach: {
    radius_frac: 0.9, # on on top face
    phase_deg: 0
  }
  spawn_offset: [0.5, 0.0] # [m] lies on the ground next to the drone (gazebo)

gazebo:
  drone_odom_topic: /starling2max_tether/drone/odom
  payload_odom_topic: /starling2max_tether/payload/odom